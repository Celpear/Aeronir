<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14b8a6" />
    <title>Audio Datasets - Aeronir</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body class="page-scroll">
    <div id="topbar">
        <div class="logo">
            <img src="/icons/icon-32.png" alt="Aeronir" class="logo-img" />
            <span class="logo-text">Aeronir</span>
        </div>
        <nav class="nav-links" aria-label="App section">
            <a href="/" class="toplink">Satellite</a>
            <a href="/datasets" class="toplink active" aria-current="page">Custom</a>
            <div class="nav-group nav-group-admin">
                <a href="/db" class="toplink" id="db-link" style="display:none">Database</a>
                <a href="/admin" class="toplink" id="admin-link" style="display:none">Users</a>
            </div>
        </nav>
        <div id="user-info" class="user-info"></div>
    </div>
    <nav class="sub-appbar" aria-label="Custom Navigation">
        <a href="/datasets" class="toplink">Image Datasets</a>
        <a href="/audio-datasets" class="toplink active" aria-current="page">Audio Datasets</a>
    </nav>

    <div id="datasets-page">
        <header class="datasets-hero">
            <div>
                <h1>Audio Datasets</h1>
                <p>WAV and MP3 tracks, labeled time segments, and train/valid/test splits.</p>
            </div>
            <button id="create-project-btn" class="export-btn primary">+ New dataset</button>
        </header>

        <form id="create-project-form" class="create-project-card" hidden>
            <div class="form-group">
                <label for="project-name">Dataset name</label>
                <input id="project-name" type="text" maxlength="80" placeholder="e.g. speech-and-sounds" required />
            </div>
            <div class="form-group">
                <label for="project-description">Description (optional)</label>
                <input id="project-description" type="text" maxlength="200" placeholder="Which sounds should this dataset contain?" />
            </div>
            <div class="create-project-actions">
                <button type="submit" class="export-btn primary">Create</button>
                <button type="button" id="cancel-create-btn" class="export-btn">Cancel</button>
            </div>
        </form>

        <div id="projects-grid" class="projects-grid">
            <p class="no-data">Loading projects…</p>
        </div>
    </div>

    <script src="/auth.js"></script>
    <script src="/audio-projects.js"></script>
<script type="module" src="/dataset-management.js"></script>
</body>

</html>
